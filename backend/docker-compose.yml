# Local PostgreSQL only. Problem execution containers live in ../docker.
name: bugdr
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bugdr
      POSTGRES_PASSWORD: bugdr
      POSTGRES_DB: bugdr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
volumes:
  pgdata:
